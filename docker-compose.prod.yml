## Production topology: API and worker are the same image with different
## commands. The worker is separate so a slow send queue cannot stall requests,
## and so the sweep is registered exactly once.
##
##   docker compose -f docker-compose.prod.yml up -d --build
##
## Both data stores are hosted, so this file runs only the app. It expects a
## .env file alongside it with:
##   DATABASE_URL  Neon connection string, including ?sslmode=require
##   REDIS_URL     Upstash TCP URL (rediss://...). The Upstash database must
##                 have eviction turned off: evicting a BullMQ key loses a send.

services:
  api:
    build: .
    command: ["node", "dist/server.js"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      # The worker container owns the sweep and the send queue.
      RUN_WORKER_IN_PROCESS: "false"
    ports:
      # PORT is interpolated from .env; the app listens on it inside the
      # container, so both sides must match.
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${PORT:-3000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: ["node", "dist/worker-entry.js"]
    env_file: [.env]
    environment:
      NODE_ENV: production
    restart: unless-stopped
    # Exactly one. The sweep is a BullMQ repeatable job so a second replica
    # would not double-send, but there is nothing to gain from one either.
    deploy:
      replicas: 1

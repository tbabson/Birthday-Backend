name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: birthday
          POSTGRES_PASSWORD: birthday
          POSTGRES_DB: birthday
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U birthday -d birthday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # The runner's service containers own these ports outright, so unlike
      # local development there is no need to shift them.
      DATABASE_URL: postgres://birthday:birthday@localhost:5432/birthday
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-chars-long
      EMAIL_PROVIDER: console
      APP_URL: http://localhost:3000
      WEB_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check migrations are in sync with the schema
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet --exit-code drizzle; then
            echo "::error::drizzle/ is out of date — run 'npm run db:generate' and commit the result."
            git diff --stat drizzle
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
